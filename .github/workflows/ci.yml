name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: pip install conan cmake ninja

      - name: Detect Conan profile
        run: conan profile detect

      - name: Install dependencies
        run: >
          conan install .
          --output-folder=build/${{ matrix.preset }}
          --build=missing
          -s build_type=${{ matrix.preset }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        if: matrix.preset == 'Debug'
        working-directory: build/Debug
        run: ctest --output-on-failure

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        preset: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: pip install conan cmake ninja

      - name: Detect Conan profile
        run: conan profile detect

      - name: Install dependencies
        run: >
          conan install .
          --output-folder=build/${{ matrix.preset }}
          --build=missing
          -s build_type=${{ matrix.preset }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        if: matrix.preset == 'Debug'
        working-directory: build/Debug
        run: ctest --output-on-failure

  format-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check clang-format
        run: |
          find src include tests -name "*.cpp" -o -name "*.h" | \
            xargs clang-format --dry-run --Werror

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        preset: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: pip install conan cmake ninja

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Detect Conan profile
        run: conan profile detect

      - name: Fix MSVC cppstd
        shell: pwsh
        run: |
          $profilePath = conan profile path default
          (Get-Content $profilePath) -replace 'compiler.cppstd=14', 'compiler.cppstd=23' | Set-Content $profilePath

      - name: Install dependencies
        run: >
          conan install .
          --output-folder=build/${{ matrix.preset }}
          --build=missing
          -s build_type=${{ matrix.preset }}
          -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        if: matrix.preset == 'Debug'
        working-directory: build/Debug
        run: ctest --output-on-failure
