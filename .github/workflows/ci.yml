name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: Debug
          - os: ubuntu-latest
            preset: Release
          - os: macos-latest
            preset: Debug
          - os: macos-latest
            preset: Release
          - os: windows-latest
            preset: Debug
          - os: windows-latest
            preset: Release

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: pip install conan cmake ninja

      - name: Detect Conan profile
        run: conan profile detect

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fix MSVC cppstd
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $profilePath = conan profile path default
          (Get-Content $profilePath) -replace 'compiler.cppstd=14', 'compiler.cppstd=23' | Set-Content $profilePath

      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        run: >
          conan install .
          --output-folder=build/${{ matrix.preset }}
          --build=missing
          -s build_type=${{ matrix.preset }}

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: >
          conan install .
          --output-folder=build/${{ matrix.preset }}
          --build=missing
          -s build_type=${{ matrix.preset }}
          -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        if: matrix.preset == 'Debug'
        working-directory: build/Debug
        run: ctest --output-on-failure

  format-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check clang-format
        run: |
          find src include tests -name "*.cpp" -o -name "*.h" | \
            xargs clang-format --dry-run --Werror
